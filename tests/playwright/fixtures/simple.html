<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>simple fixture</title>
        <style>
            body {
                margin: 0;
                font-family: Arial, sans-serif;
            }
            #target {
                width: 320px;
                height: 200px;
                padding: 16px;
                box-sizing: border-box;
                background: linear-gradient(#3a7bd5, #00d2ff);
                border: 4px solid #222;
                border-radius: 8px;
                color: #fff;
            }
        </style>
    </head>
    <body>
        <div id="target">
            <h1>Hello capture</h1>
            <p>Same-origin content only: no images, no fonts, no iframes.</p>
        </div>
    </body>
</html>
