<!DOCTYPE html>
<html>
<head>
    <title>Shadow DOM: nested shadow roots</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #ffffff;
        }
    </style>
</head>
<body>
    <x-outer id="host"></x-outer>
    <script>
        const outer = document.getElementById('host').attachShadow({mode: 'open'});
        outer.innerHTML = `
            <style>
                :host { display: block; border: 2px solid #444444; padding: 12px; width: 420px; }
                p { margin: 0 0 8px; color: #1a1a66; }
            </style>
            <p>Outer shadow paragraph.</p>
            <div id="inner-host"></div>
        `;
        const inner = outer.getElementById('inner-host').attachShadow({mode: 'open'});
        inner.innerHTML = `
            <style>
                .inner-box {
                    background: gold;
                    border: 1px solid #8b7500;
                    padding: 8px;
                    width: 220px;
                }
            </style>
            <div class="inner-box">Inner shadow box, two levels deep.</div>
        `;
    </script>
</body>
</html>
