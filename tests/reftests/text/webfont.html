<!DOCTYPE html>
<html>
<head lang="en">
    <meta charset="UTF-8">
    <title>Web font embedding</title>
    <style>
        /* Local OFL-licensed Karla (tests/assets/fonts/), split into latin / latin-ext
           unicode-range subsets per weight like Google Fonts serves it, plus an italic. */
        @font-face {
            font-family: 'Karla';
            font-style: normal;
            font-weight: 400;
            src: url('../../assets/fonts/karla-latin-400-normal.woff2') format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F,
                U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        @font-face {
            font-family: 'Karla';
            font-style: normal;
            font-weight: 400;
            src: url('../../assets/fonts/karla-latin-ext-400-normal.woff2') format('woff2');
            unicode-range: U+0100-024F, U+0259, U+1E00-1EFF, U+2020, U+20A0-20AB, U+20AD-20CF, U+2113, U+2C60-2C7F,
                U+A720-A7FF;
        }
        @font-face {
            font-family: 'Karla';
            font-style: normal;
            font-weight: 700;
            src: url('../../assets/fonts/karla-latin-700-normal.woff2') format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F,
                U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        @font-face {
            font-family: 'Karla';
            font-style: normal;
            font-weight: 700;
            src: url('../../assets/fonts/karla-latin-ext-700-normal.woff2') format('woff2');
            unicode-range: U+0100-024F, U+0259, U+1E00-1EFF, U+2020, U+20A0-20AB, U+20AD-20CF, U+2113, U+2C60-2C7F,
                U+A720-A7FF;
        }
        @font-face {
            font-family: 'Karla';
            font-style: italic;
            font-weight: 400;
            src: url('../../assets/fonts/karla-latin-400-italic.woff2') format('woff2');
        }

        body {
            margin: 0;
            padding: 24px;
            font-family: 'Karla', sans-serif;
            font-size: 24px;
            line-height: 1.5;
            background: #ffffff;
            color: #102030;
        }

        .bold {
            font-weight: bold;
        }

        .italic {
            font-style: italic;
        }
    </style>
</head>
<body>
    <div>Regular: The quick brown fox jumps over the lazy dog 0123456789</div>
    <div class="bold">Bold: Grumpy wizards make toxic brew for the evil queen</div>
    <div class="italic">Italic: Pack my box with five dozen liquor jugs</div>
    <div>Latin-ext: Šešir žluťoučký Łódź Œuvre Țară Ğelir</div>
    <div class="bold">Bold latin-ext: Šťastný Źrebę Ŋoŋo Ǆungla</div>
</body>
</html>
