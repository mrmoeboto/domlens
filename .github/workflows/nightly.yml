name: Nightly

on:
  schedule:
    # 07:00 UTC daily — after the workday, before the next one.
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  reftests-full:
    name: Full reftest matrix (${{ matrix.browser }} / ${{ matrix.engine }})
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.60.0-noble
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        engine: [canvas, svg]
    # TODO: webkit baselines are still being stabilized; drop continue-on-error
    # once they pass reliably (same caveat as ci.yml).
    continue-on-error: ${{ matrix.browser == 'webkit' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Same font set as ci.yml, and for the same reason — see the note there.
      - name: Install fonts (must match the baseline machine's set)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            fonts-dejavu-core fonts-dejavu-mono fonts-droid-fallback \
            fonts-freefont-ttf fonts-ipafont-gothic fonts-liberation \
            fonts-liberation-sans-narrow fonts-noto-cjk fonts-noto-color-emoji \
            fonts-noto-core fonts-noto-mono fonts-tlwg-loma-otf fonts-ubuntu \
            fonts-unifont fonts-urw-base35 fonts-wqy-zenhei \
            language-selector-common
          fc-cache -f
      - name: Build
        run: npm run build
      - name: Run reftests
        # HOME: see the note on the same step in ci.yml — Firefox will not launch in a
        # container whose $HOME is not owned by the running user.
        env:
          PW_WEBKIT: '1'
          HOME: /root
          ENGINE: ${{ matrix.engine == 'svg' && 'svg' || '' }}
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-reftest-results-${{ matrix.browser }}-${{ matrix.engine }}
          path: test-results
          if-no-files-found: ignore

  bench:
    name: Bench vs competitors + regression gate
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Preserve committed baseline
        run: cp tests/bench/results/latest.json /tmp/bench-baseline.json
      - name: Run benchmark suite
        run: npm run bench
      - name: Regression gate (>20% median slowdown vs baseline fails)
        run: npx tsx tests/bench/check-regression.ts /tmp/bench-baseline.json tests/bench/results/latest.json
      - name: Upload bench results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-bench-results
          path: tests/bench/results
          if-no-files-found: error
