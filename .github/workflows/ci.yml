name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: Lint, typecheck, unit test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run unittest
      - name: Build
        run: npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/*/dist
          if-no-files-found: error

  reftests:
    name: Reftests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.60.0-noble
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    # TODO: webkit baselines are still being stabilized; drop continue-on-error
    # once they pass reliably.
    continue-on-error: ${{ matrix.browser == 'webkit' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Run reftests
        # PW_WEBKIT=1 makes the webkit project visible in playwright.config.ts
        # (it is hidden by default because webkit does not run on dev hosts).
        env:
          PW_WEBKIT: '1'
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reftest-results-${{ matrix.browser }}
          path: test-results
          if-no-files-found: ignore
