name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger. Also the escape hatch for the case that produced it: workflows
  # added in a repository's very first push do not always fire on that push.
  workflow_dispatch:

jobs:
  build:
    name: Lint, typecheck, unit test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run unittest
      - name: Build
        run: npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/*/dist
          if-no-files-found: error

  reftests:
    name: Reftests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.60.0-noble
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # The reftest baselines are compared on exact dimensions before pixels, so a family
      # resolving to a different face re-wraps the text and fails as
      # "Size mismatch: baseline is 800x1560, actual is 800x1440". The fixtures ask for
      # Arial, Helvetica and Times New Roman, none of which exist on Linux, so each one is
      # a fontconfig substitution decided entirely by which font files are installed.
      #
      # This is the font package set of the machine the baselines were generated on,
      # reproduced here so the container resolves them identically. Pinning families in a
      # fontconfig file was tried instead and is a trap: `fc-match Arial` reports Liberation
      # Sans, but assigning that family outright still changed local rendering on three
      # fixtures, because browsers query fontconfig with more than a family name. Matching
      # the font set is what actually reproduces the baselines; overriding resolution is not.
      #
      # language-selector-common ships no fonts. It ships the fontconfig rules that decide
      # which font wins for a script — 30-cjk-aliases.conf, 64-language-selector-cjk-prefer.conf
      # and the 69-language-selector-* set. Without it the container has Noto Sans Thai and
      # Loma installed and picks Loma, where the baseline machine picks Noto Sans Thai; that
      # single difference is what kept text/lang/thai.html and text/lang/chinese.html failing
      # after every font package already matched. Installing the fonts is necessary and was
      # not sufficient.
      #
      # A missing package here does not fail loudly — fontconfig silently substitutes and
      # the run fails somewhere in tests/reftests/text. Adding a fixture that needs a new
      # face means adding its package here.
      - name: Install fonts (must match the baseline machine's set)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            fonts-dejavu-core fonts-dejavu-mono fonts-droid-fallback \
            fonts-freefont-ttf fonts-ipafont-gothic fonts-liberation \
            fonts-liberation-sans-narrow fonts-noto-cjk fonts-noto-color-emoji \
            fonts-noto-core fonts-noto-mono fonts-tlwg-loma-otf fonts-ubuntu \
            fonts-unifont fonts-urw-base35 fonts-wqy-zenhei \
            language-selector-common
          fc-cache -f
      - name: Build
        run: npm run build
      - name: Run reftests
        # PW_WEBKIT=1 makes the webkit project visible in playwright.config.ts
        # (it is hidden by default because webkit does not run on dev hosts).
        # HOME is overridden because the job runs in a container as root while the
        # runner points HOME at /github/home, which root does not own — and Firefox
        # refuses to start at all in that state ("Firefox is unable to launch if the
        # $HOME folder isn't owned by the current user"), failing every spec in 2-5ms
        # with no rendering involved. Chromium and WebKit do not care, so this shows up
        # as one browser inexplicably failing everything.
        env:
          PW_WEBKIT: '1'
          HOME: /root
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reftest-results-${{ matrix.browser }}
          path: test-results
          if-no-files-found: ignore
